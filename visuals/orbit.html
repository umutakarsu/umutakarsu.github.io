<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIO Layer — Orbit Visual</title>
<style>
  :root{
    --accent:#5cf2d6; --accent2:#7aa2ff; --accent3:#ff8a5c;
    --muted:#8ea3c9; --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:radial-gradient(circle at 50% 40%,#0a1030,#04060f 70%);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e9f0ff}
  body.transparent{background:transparent}            /* press T for transparent bg (for compositing) */
  body.clean .ui,body.clean .ring-label{display:none} /* press H to hide all labels */
  #stars{position:fixed;inset:0;z-index:0}

  .stage{position:fixed;inset:0;display:grid;place-items:center;z-index:1}
  .scene{position:relative;width:min(78vmin,720px);aspect-ratio:1/1;perspective:1200px}
  .system{position:absolute;inset:0;transform-style:preserve-3d;
    transform:rotateX(64deg) rotateZ(-12deg);
    animation:sysDrift 30s ease-in-out infinite alternate}
  @keyframes sysDrift{from{transform:rotateX(61deg) rotateZ(-18deg)}to{transform:rotateX(71deg) rotateZ(-2deg)}}

  .earth-holder{position:absolute;top:50%;left:50%;width:46%;height:46%;
    transform:translate(-50%,-50%) rotateZ(12deg) rotateX(-64deg)}
  .earth{position:absolute;inset:0;border-radius:50%;overflow:hidden;
    background:radial-gradient(circle at 32% 28%,#2b6cff 0%,#15399c 38%,#0a1f57 70%,#050d2b 100%);
    box-shadow:inset -26px -18px 70px rgba(0,0,0,.85),inset 24px 18px 46px rgba(120,180,255,.25),
      0 0 70px rgba(60,120,255,.45),0 0 170px rgba(40,90,220,.25)}
  .earth::before{content:"";position:absolute;top:-25%;left:-25%;width:200%;height:160%;
    background:
      radial-gradient(ellipse 80px 50px at 30% 40%,rgba(74,222,168,.55),transparent 60%),
      radial-gradient(ellipse 120px 60px at 62% 55%,rgba(74,222,168,.45),transparent 60%),
      radial-gradient(ellipse 60px 90px at 48% 72%,rgba(74,222,168,.40),transparent 60%),
      radial-gradient(ellipse 90px 40px at 78% 30%,rgba(74,222,168,.35),transparent 60%),
      radial-gradient(ellipse 70px 50px at 20% 65%,rgba(74,222,168,.35),transparent 60%);
    filter:blur(1.2px);animation:spin 44s linear infinite}
  .earth::after{content:"";position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.35),transparent 45%);mix-blend-mode:screen}
  @keyframes spin{to{transform:rotate(360deg)}}

  .ring{position:absolute;top:50%;left:50%;border-radius:50%;transform:translate(-50%,-50%)}
  .ring.leo{width:60%;height:60%;border:1px dashed rgba(122,162,255,.22)}
  .ring.mio{width:84%;height:84%;border:1.6px solid rgba(92,242,214,.6);
    box-shadow:0 0 34px rgba(92,242,214,.28),inset 0 0 34px rgba(92,242,214,.12)}
  .ring.band-a{width:90%;height:90%;border:1px dashed rgba(92,242,214,.22)}
  .ring.band-b{width:78%;height:78%;border:1px dashed rgba(92,242,214,.22)}

  .orbit{position:absolute;top:50%;left:50%;width:84%;height:84%;transform:translate(-50%,-50%);transform-style:preserve-3d}
  .o1{animation:orbit 15s linear infinite}
  .o2{animation:orbit 15s linear infinite;animation-delay:-3s}
  .o3{animation:orbit 15s linear infinite;animation-delay:-6s}
  .o4{animation:orbit 15s linear infinite;animation-delay:-9s}
  .o5{animation:orbit 15s linear infinite;animation-delay:-12s}
  .o6{width:78%;height:78%;animation:orbit 19s linear infinite reverse;animation-delay:-5s}
  .o7{width:90%;height:90%;animation:orbit 24s linear infinite;animation-delay:-11s}
  @keyframes orbit{to{transform:translate(-50%,-50%) rotate(360deg)}}

  .sat{position:absolute;top:-12px;left:50%;width:24px;height:24px;margin-left:-12px;
    transform:rotateX(-64deg) rotateZ(12deg)}
  .chip{width:24px;height:24px;border-radius:5px;position:relative;
    background:linear-gradient(135deg,#0d3a4f,#072330);border:1px solid var(--accent);
    box-shadow:0 0 16px rgba(92,242,214,.85),0 0 4px #fff inset}
  .chip::before{content:"";position:absolute;inset:5px;border-radius:2px;
    background:repeating-linear-gradient(0deg,rgba(92,242,214,.9) 0 1px,transparent 1px 3px),
               repeating-linear-gradient(90deg,rgba(92,242,214,.9) 0 1px,transparent 1px 3px);opacity:.7}
  .chip::after{content:"";position:absolute;inset:-4px;border-radius:8px;border:1px solid rgba(92,242,214,.25)}
  .sat .wing{position:absolute;top:7px;width:13px;height:10px;
    background:linear-gradient(90deg,#1b4f7a,#0c2c47);border:1px solid var(--accent2);box-shadow:0 0 8px rgba(122,162,255,.5)}
  .sat .wing.l{left:-16px} .sat .wing.r{right:-16px}
  .beam{position:absolute;top:10px;left:50%;width:2px;height:70px;margin-left:-1px;transform-origin:top center;
    background:linear-gradient(180deg,var(--accent),transparent);opacity:0;animation:ping 15s linear infinite}
  .o1 .beam{animation-delay:-1s}.o3 .beam{animation-delay:-7s}.o5 .beam{animation-delay:-13s}.o7 .beam{animation-delay:-19s}
  @keyframes ping{0%,80%{opacity:0}85%{opacity:.95}100%{opacity:0}}

  .ring-label{position:absolute;top:4%;left:50%;transform:translateX(-50%);z-index:5;text-align:center;
    font-family:var(--mono);font-size:13px;letter-spacing:.24em;color:var(--accent);text-shadow:0 0 14px rgba(92,242,214,.6)}
  .ring-label small{display:block;color:var(--muted);letter-spacing:.14em;font-size:10px;margin-top:3px}

  .ui{position:fixed;z-index:6;font-family:var(--mono)}
  .ui.title{left:42px;top:38px;font-size:14px;letter-spacing:.16em;color:#e9f0ff}
  .ui.title b{color:var(--accent)} .ui.title small{display:block;color:var(--muted);font-size:11px;letter-spacing:.2em;margin-top:6px}
  .ui.hint{right:18px;bottom:14px;font-size:10px;color:var(--muted);letter-spacing:.1em;opacity:.6}
  @media(max-width:600px){.ui.title{left:20px;top:20px}}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="ui title">[ COMPANY ] · <b>MIO LAYER</b><small>neuromorphic constellation</small></div>

<div class="stage">
  <div class="scene">
    <div class="system">
      <div class="ring leo"></div>
      <div class="ring band-b"></div>
      <div class="ring mio"></div>
      <div class="ring band-a"></div>

      <div class="orbit o1"><div class="sat"><div class="wing l"></div><div class="chip"></div><div class="wing r"></div><div class="beam"></div></div></div>
      <div class="orbit o2"><div class="sat"><div class="wing l"></div><div class="chip"></div><div class="wing r"></div></div></div>
      <div class="orbit o3"><div class="sat"><div class="wing l"></div><div class="chip"></div><div class="wing r"></div><div class="beam"></div></div></div>
      <div class="orbit o4"><div class="sat"><div class="wing l"></div><div class="chip"></div><div class="wing r"></div></div></div>
      <div class="orbit o5"><div class="sat"><div class="wing l"></div><div class="chip"></div><div class="wing r"></div><div class="beam"></div></div></div>
      <div class="orbit o6"><div class="sat"><div class="wing l"></div><div class="chip"></div><div class="wing r"></div></div></div>
      <div class="orbit o7"><div class="sat"><div class="wing l"></div><div class="chip"></div><div class="wing r"></div><div class="beam"></div></div></div>

      <div class="earth-holder"><div class="earth"></div></div>
    </div>
    <div class="ring-label">◦ MIO LAYER ◦<small>medium-inclination orbital tier</small></div>
  </div>
</div>

<div class="ui hint">H = hide labels · T = transparent bg</div>

<script>
(function(){
  const c=document.getElementById('stars'),x=c.getContext('2d');let w,h,st=[];
  function size(){w=c.width=innerWidth;h=c.height=innerHeight;
    st=Array.from({length:Math.min(240,Math.floor(w*h/8500))},()=>({x:Math.random()*w,y:Math.random()*h,z:Math.random()*1.7+.3,p:Math.random()*6.28}));}
  size();addEventListener('resize',size);
  (function d(t){x.clearRect(0,0,w,h);for(const s of st){const a=.35+.6*Math.abs(Math.sin(s.p+t/950*s.z));
    x.fillStyle='rgba(180,210,255,'+a.toFixed(2)+')';x.fillRect(s.x,s.y,s.z,s.z);}requestAnimationFrame(d);})(0);
})();
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if(k==='h')document.body.classList.toggle('clean');
  if(k==='t')document.body.classList.toggle('transparent');});
</script>
</body>
</html>
