<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toolbox</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #070707;
      background-color: #f0ecdf;
      min-height: 100vh;
      padding: 3rem 2rem;
    }

    main { max-width: 760px; margin: 0 auto; }

    h1 { font-size: 2rem; font-weight: 600; margin-bottom: 0.25rem; }
    .subtitle { color: #666; margin-bottom: 2.5rem; }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }

    .tool-card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: #fffdf7;
      border: 1px solid #e3ddca;
      border-radius: 12px;
      padding: 1.25rem;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .tool-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }
    .tool-card.disabled {
      opacity: 0.55;
      pointer-events: none;
    }

    .tool-icon { font-size: 1.75rem; margin-bottom: 0.5rem; }
    .tool-name { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.25rem; }
    .tool-desc { font-size: 0.9rem; color: #666; }
    .tool-soon {
      display: inline-block;
      margin-top: 0.6rem;
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #9a8f70;
    }
  </style>
</head>
<body>
  <main>
    <h1>Toolbox</h1>
    <p class="subtitle">A growing stack of small tools, just for me.</p>
    <div class="tool-grid" id="tool-grid"></div>
  </main>

  <script>
    // To add a new tool later: drop a folder under tools/, then add one entry
    // here. Set `href` to its HTML page, or leave `soon: true` as a placeholder.
    const TOOLS = [
      {
        icon: '📄',
        name: 'PDF Maker',
        desc: 'Draw, type, or paste things on a page, then export it as a PDF.',
        href: 'tools/pdf-maker/pdf-maker.html',
      },
      // Example placeholder for the next tool you mentioned wanting:
      // { icon: '🖼️', name: 'Image → PDF', desc: 'Combine images into one PDF.', soon: true },
    ];

    const grid = document.getElementById('tool-grid');
    for (const tool of TOOLS) {
      const card = document.createElement('a');
      card.className = 'tool-card' + (tool.soon ? ' disabled' : '');
      card.href = tool.soon ? '#' : tool.href;
      card.innerHTML = `
        <div class="tool-icon">${tool.icon}</div>
        <div class="tool-name">${tool.name}</div>
        <div class="tool-desc">${tool.desc}</div>
        ${tool.soon ? '<span class="tool-soon">Coming soon</span>' : ''}
      `;
      grid.appendChild(card);
    }
  </script>
</body>
</html>
